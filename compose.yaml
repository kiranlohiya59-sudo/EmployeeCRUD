
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: crud_db
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
     - "8081:8080"
    environment:
      DB_HOST: mysql
      DB_NAME: crud_db
      DB_USERNAME: root
      DB_PASSWORD: root123
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: